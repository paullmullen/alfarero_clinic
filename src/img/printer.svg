  <!-- bottom printing -->
  <rect x="8" y="17" width="8" height=".2" rx="2" />
  <rect x="8" y="19" width="8" height=".2" rx="2" />
  
  <!-- small button -->
  <circle cx="16.5" cy="12.5" r="1.25" fill="white" />

</svg>